<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- deep night background -->
    <radialGradient id="bg" cx="50%" cy="44%" r="70%">
      <stop offset="0" stop-color="#2b0f4a"/>
      <stop offset="0.45" stop-color="#170828"/>
      <stop offset="1" stop-color="#07030d"/>
    </radialGradient>
    <!-- aura behind the gem -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7e22ce" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d5ff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0.5"/>
    </linearGradient>
    <!-- facet fills -->
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#9333ea"/></linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#faf5ff"/><stop offset="1" stop-color="#d8b4fe"/></linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d5ff"/><stop offset="1" stop-color="#b57bfa"/></linearGradient>
    <linearGradient id="f4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#7e22ce"/></linearGradient>
    <linearGradient id="f5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7e22ce"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6b21a8"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9333ea"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b21a8"/><stop offset="1" stop-color="#2e1065"/></linearGradient>
    <linearGradient id="p4" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c1d95"/><stop offset="1" stop-color="#1e0b3a"/></linearGradient>
    <!-- sheen across the gem -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="gemClip"><polygon points="196,166 316,166 376,228 256,392 136,228"/></clipPath>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10 Z" fill="#f5e8ff"/>
    </symbol>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- star dust -->
  <g fill="#e9d5ff">
    <circle cx="78" cy="96" r="1.6" opacity="0.55"/>
    <circle cx="132" cy="58" r="1.1" opacity="0.4"/>
    <circle cx="420" cy="84" r="1.4" opacity="0.5"/>
    <circle cx="452" cy="170" r="1" opacity="0.35"/>
    <circle cx="60" cy="300" r="1.2" opacity="0.35"/>
    <circle cx="98" cy="420" r="1.5" opacity="0.45"/>
    <circle cx="430" cy="410" r="1.2" opacity="0.4"/>
    <circle cx="300" cy="62" r="1" opacity="0.35"/>
    <circle cx="210" cy="470" r="1.1" opacity="0.3"/>
    <circle cx="470" cy="300" r="1.5" opacity="0.4"/>
    <circle cx="40" cy="190" r="1" opacity="0.3"/>
    <circle cx="350" cy="460" r="1.3" opacity="0.35"/>
  </g>

  <!-- aura + halo ring -->
  <circle cx="256" cy="262" r="210" fill="url(#aura)"/>
  <circle cx="256" cy="262" r="176" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.55"/>
  <circle cx="256" cy="262" r="192" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.18" stroke-dasharray="2 9"/>

  <g transform="translate(0,-16)">
  <!-- reflection under the gem -->
  <ellipse cx="256" cy="420" rx="96" ry="11" fill="#a855f7" opacity="0.35" filter="url(#blur6)"/>

  <!-- glow silhouette -->
  <polygon points="196,166 316,166 376,228 256,392 136,228" fill="#a855f7" opacity="0.6" filter="url(#blur18)"/>

  <!-- the gem -->
  <g stroke="#f3e8ff" stroke-opacity="0.35" stroke-width="1.4" stroke-linejoin="round">
    <!-- crown -->
    <polygon points="136,228 196,166 216,228" fill="url(#f1)"/>
    <polygon points="196,166 256,166 216,228" fill="url(#f2)"/>
    <polygon points="256,166 216,228 296,228" fill="url(#f3)"/>
    <polygon points="256,166 316,166 296,228" fill="url(#f4)"/>
    <polygon points="316,166 376,228 296,228" fill="url(#f5)"/>
    <!-- pavilion -->
    <polygon points="136,228 216,228 256,392" fill="url(#p1)"/>
    <polygon points="216,228 256,228 256,392" fill="url(#p2)"/>
    <polygon points="256,228 296,228 256,392" fill="url(#p3)"/>
    <polygon points="296,228 376,228 256,392" fill="url(#p4)"/>
  </g>
  <!-- sheen + girdle highlight -->
  <polygon points="196,166 316,166 376,228 256,392 136,228" fill="url(#sheen)" clip-path="url(#gemClip)"/>
  <line x1="138" y1="228" x2="374" y2="228" stroke="#faf5ff" stroke-width="1.6" stroke-opacity="0.55"/>
  <polygon points="196,166 316,166 376,228 256,392 136,228" fill="none" stroke="#f3e8ff" stroke-width="2" stroke-opacity="0.5" stroke-linejoin="round"/>

  </g>

  <!-- sparkles -->
  <g>
    <use href="#spark" x="318" y="118" width="44" height="44" opacity="0.5" filter="url(#blur3)"/>
    <use href="#spark" x="320" y="120" width="40" height="40"/>
    <use href="#spark" x="150" y="318" width="22" height="22" opacity="0.85"/>
    <use href="#spark" x="372" y="290" width="16" height="16" opacity="0.7"/>
    <use href="#spark" x="118" y="138" width="14" height="14" opacity="0.6"/>
    <circle cx="212" cy="168" r="3" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
